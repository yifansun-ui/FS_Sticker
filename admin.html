<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LPコメント管理画面 - GitHub Issues投稿</title>
<meta name="robots" content="noindex,nofollow">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;
    margin: 0; padding: 24px; background: #f6f8fa; color: #24292e;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #586069; font-size: 13px; margin-bottom: 20px; }
  .config-box {
    background: #fff; border: 1px solid #e1e4e8; border-radius: 8px;
    padding: 16px; margin-bottom: 20px;
  }
  .config-box label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; }
  .config-box input {
    width: 100%; border: 1px solid #e1e4e8; border-radius: 6px;
    padding: 8px 12px; font-size: 13px; color: #24292e;
  }
  .config-box input::placeholder { color: #999; }
  .stats {
    background: #fff; border: 1px solid #e1e4e8; border-radius: 8px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 13px;
  }
  .stats b { color: #0366d6; }
  .actions {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .actions button {
    background: #28a745; color: #fff; border: none; padding: 8px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;
    transition: background 0.2s;
  }
  .actions button:hover { background: #218838; }
  .actions button:disabled { background: #ccc; cursor: not-allowed; }
  .actions button.secondary { background: #6f42c1; }
  .actions button.secondary:hover { background: #5a32a3; }
  .item {
    background: #fff; border: 1px solid #e1e4e8; border-radius: 6px;
    padding: 16px; margin-bottom: 12px;
  }
  .item.posted { background: #f0f8f4; }
  .num {
    display: inline-block; width: 28px; height: 28px;
    background: #dc2626; color: #fff; border-radius: 50%;
    text-align: center; line-height: 28px; font-weight: bold; font-size: 12px;
    margin-right: 10px; vertical-align: middle;
  }
  .num.posted { background: #16a34a; }
  .header {
    display: flex; align-items: center; margin-bottom: 8px;
  }
  .title { font-weight: 600; font-size: 13px; color: #24292e; }
  .meta { color: #586069; font-size: 12px; margin-top: 4px; }
  .body {
    font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
    margin: 8px 0; padding: 8px; background: #f9fafa; border-radius: 4px;
    color: #24292e;
  }
  .item-actions {
    display: flex; gap: 6px; margin-top: 10px;
  }
  .item-actions button {
    background: #0366d6; color: #fff; border: none; padding: 5px 12px;
    border-radius: 4px; cursor: pointer; font-size: 12px;
    transition: background 0.2s;
  }
  .item-actions button:hover { background: #0256c7; }
  .item-actions button.delete { background: #dc2626; }
  .item-actions button.delete:hover { background: #cb2431; }
  .empty {
    text-align: center; padding: 40px 20px; color: #586069;
    background: #fff; border-radius: 8px; border: 1px solid #e1e4e8;
  }
  .status {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500;
    margin-left: 8px;
  }
  .status.posted { background: #d4edda; color: #155724; }
  .status.unposted { background: #fff3cd; color: #856404; }
  .alert {
    background: #fef5e7; border: 1px solid #f8d7da; border-radius: 6px;
    padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: #721c24;
  }
</style>
</head>
<body>

<div class="container">
  <h1>LPコメント管理画面</h1>
  <div class="sub">クライアントのフィードバックを GitHub Issues に投稿します</div>

  <div class="config-box">
    <label>GitHub Personal Access Token（PAT）</label>
    <input id="token-input" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxx" />
    <div style="font-size: 11px; color: #999; margin-top: 4px;">
      このページのみで使用（サーバーに送信されません）
    </div>
  </div>

  <div class="stats">
    💾 ローカルストレージから読み込み中…<span id="stats"></span>
  </div>

  <div class="actions">
    <button onclick="postSelectedToGitHub()">📤 選択を GitHub に投稿</button>
    <button class="secondary" onclick="refreshComments()">🔄 再読み込み</button>
  </div>

  <div id="list"></div>
</div>

<script>
const STORAGE_KEY = "lp-comments-v1";
const TOKEN_KEY = "lp-comments-token";
const listEl = document.getElementById("list");
const statsEl = document.getElementById("stats");
const tokenInput = document.getElementById("token-input");

// 設定情報（これはあなたが入力します）
const GITHUB_OWNER = "yifansun-ui";
const GITHUB_REPO = "FS_Sticker";

// 起動時に保存されたトークンを復元
window.addEventListener("load", () => {
  const saved = localStorage.getItem(TOKEN_KEY);
  if (saved) tokenInput.value = saved;
  refreshComments();
});

// トークン変更時に保存
tokenInput.addEventListener("input", (e) => {
  localStorage.setItem(TOKEN_KEY, e.target.value);
});

function loadComments() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch (e) {
    return {};
  }
}

function saveComments(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function refreshComments() {
  const all = loadComments();
  const entries = Object.entries(all).sort((a, b) => b[1].createdAt - a[1].createdAt);
  
  statsEl.innerHTML = ` - <b>${entries.length}</b>件（<b>${entries.filter(([,c])=>!c.posted).length}</b>件未投稿）`;

  if (!entries.length) {
    listEl.innerHTML = '<div class="empty">コメントはまだありません</div>';
    return;
  }

  listEl.innerHTML = entries.map(([id, c], i) => {
    const date = new Date(c.createdAt).toLocaleString("ja-JP");
    const numClass = c.posted ? "posted" : "";
    const statusClass = c.posted ? "posted" : "unposted";
    const statusText = c.posted ? "投稿済" : "未投稿";
    
    return `
      <div class="item ${c.posted ? 'posted' : ''}">
        <div class="header">
          <span class="num ${numClass}">${i + 1}</span>
          <span class="title">${escapeHTML(c.name || "匿名")}</span>
          <span class="status ${statusClass}">${statusText}</span>
        </div>
        <div class="meta">${date}</div>
        <div class="body">${escapeHTML(c.text)}</div>
        <div class="meta">位置: ${c.x?.toFixed(1)}%, ${c.y?.toFixed(1)}% | ページ: ${c.url || "/"}</div>
        <div class="item-actions">
          ${!c.posted ? `<button onclick="postOneToGitHub('${id}')">📤 投稿</button>` : ''}
          <button class="delete" onclick="deleteComment('${id}')">🗑 削除</button>
        </div>
      </div>
    `;
  }).join("");
}

async function postOneToGitHub(id) {
  const token = tokenInput.value.trim();
  if (!token) {
    alert("Token を入力してください");
    return;
  }

  const all = loadComments();
  const comment = all[id];
  if (!comment) return;

  const title = `[LP Feedback] ${comment.name || "匿名"} より`;
  const body = `**コメント内容：**
${comment.text}

---
投稿者: ${comment.name || "匿名"}
ページ位置: ${comment.x?.toFixed(1)}%, ${comment.y?.toFixed(1)}%
ページ: ${comment.url || "/"}
`;

  try {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues`, {
      method: "POST",
      headers: {
        "Authorization": `token ${token}`,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ title, body })
    });

    if (!res.ok) {
      const err = await res.json();
      alert(`エラー: ${err.message || res.statusText}`);
      return;
    }

    all[id].posted = true;
    saveComments(all);
    refreshComments();
    alert("GitHub Issues に投稿しました！");
  } catch (e) {
    alert(`エラー: ${e.message}`);
  }
}

async function postSelectedToGitHub() {
  const token = tokenInput.value.trim();
  if (!token) {
    alert("Token を入力してください");
    return;
  }

  const all = loadComments();
  const unposted = Object.entries(all).filter(([, c]) => !c.posted);

  if (!unposted.length) {
    alert("投稿待ちのコメントがありません");
    return;
  }

  if (!confirm(`${unposted.length}件を GitHub Issues に投稿します。よろしいですか？`)) {
    return;
  }

  let posted = 0;
  for (const [id, comment] of unposted) {
    const title = `[LP Feedback] ${comment.name || "匿名"} より`;
    const body = `**コメント内容：**
${comment.text}

---
投稿者: ${comment.name || "匿名"}
ページ位置: ${comment.x?.toFixed(1)}%, ${comment.y?.toFixed(1)}%
ページ: ${comment.url || "/"}
`;

    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues`, {
        method: "POST",
        headers: {
          "Authorization": `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ title, body })
      });

      if (res.ok) {
        all[id].posted = true;
        posted++;
      } else {
        const err = await res.json();
        console.error(`Issue ${id} failed:`, err);
      }
    } catch (e) {
      console.error(`Issue ${id} failed:`, e);
    }
  }

  saveComments(all);
  refreshComments();
  alert(`${posted}/${unposted.length} 件を投稿しました`);
}

function deleteComment(id) {
  if (!confirm("このコメントを削除しますか？")) return;
  const all = loadComments();
  delete all[id];
  saveComments(all);
  refreshComments();
}

function escapeHTML(s) {
  return String(s || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// 定期的に同期
setInterval(refreshComments, 2000);
</script>

</body>
</html>
